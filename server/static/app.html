<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>369 Studio — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
:root{--bg:#0c0d11;--surface:#15171e;--surface2:#1c1f28;--line:#282c37;--text:#f2efe7;--muted:#98a0b0;--faint:#697082;--gold:#e8b04b;--gold-dim:#8a6a2c;--mag:#ff4d8d;--cyan:#4fd1c5;--crit:#e5544e;--disp:"Bricolage Grotesque",Georgia,serif;--body:"Figtree",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--r:14px;--rs:10px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5}
h1{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;margin:0}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}textarea{resize:vertical;min-height:70px}
.top{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,4vw,28px);background:rgba(12,13,17,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:10}
.brand{font-family:var(--disp);font-weight:800;font-size:18px}.brand b{color:var(--gold)}
.wallet{margin-left:auto;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px clamp(16px,4vw,28px);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.tabs a.on{background:var(--gold);color:#161009}.tabs a:hover{color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:clamp(20px,5vw,40px) clamp(16px,4vw,28px)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(22px,4vw,30px);margin-top:8px}.sub{color:var(--muted);margin:8px 0 18px}
.field{margin-bottom:12px}.field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:6px}
.gen{display:inline-flex;flex-direction:column;align-items:center;padding:11px 22px;border-radius:11px;background:var(--gold);color:#161009;font-weight:800;margin-top:6px}
.gen small{font-family:var(--mono);font-size:10.5px;opacity:.75}.gen:disabled{opacity:.5;cursor:not-allowed}
.out{margin-top:20px;border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--faint);background:var(--surface)}
.out.on{border-style:solid;border-color:var(--gold-dim);color:var(--text)}
.pbar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:14px auto 0;max-width:320px}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--mag));transition:width .4s}
video,img.res{max-width:100%;border-radius:10px;margin-top:8px}
.qc{font-family:var(--mono);font-size:11px;margin-top:8px}.qc.pass{color:var(--cyan)}.qc.warn{color:var(--gold)}
.gate{max-width:360px;margin:12vh auto;text-align:center}.gate input{margin-bottom:10px}.gate .btn{width:100%;padding:12px;border-radius:11px;background:var(--gold);color:#161009;font-weight:800}
.msg{font-size:12.5px;margin-top:8px;min-height:16px}.msg.err{color:var(--crit)}
.note{font-size:11px;color:var(--faint);margin-top:12px}
</style></head><body>
<div class="top"><div class="brand" onclick="location.href='/'">369<b>Studio</b></div><div class="wallet" id="wallet" hidden>— cr</div></div>
<div class="tabs" id="tabs" hidden></div>
<div class="gate" id="gate">
  <div class="eyebrow">369 Studio</div><h1 style="margin-top:8px">Sign in</h1>
  <div style="margin-top:16px"><input id="email" type="email" placeholder="email"><input id="pass" type="password" placeholder="password"><button class="btn" onclick="doAuth()">Sign in</button><div class="msg" id="msg"></div></div>
</div>
<div class="wrap" id="app" hidden>
  <div class="eyebrow" id="app-kicker">App</div>
  <h1 id="app-name">…</h1>
  <p class="sub" id="app-sub">Fill in and generate — same engine, app-shaped prompt.</p>
  <div id="fields"></div>
  <button class="gen" id="gen" onclick="run()">Generate <small id="cost">—</small></button>
  <div class="out" id="out"><div style="font-size:28px">✨</div><p>Result yahan aayega.</p></div>
  <p class="note">Same backend as Creator — this app just shapes the prompt + params (template). QC gate on every render.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var sb=window.supabase.createClient(window.SUPA_URL,window.SUPA_ANON);
var TOKEN=null,APPS=[],CUR=null;
var qp=new URLSearchParams(location.search); var appId=qp.get('app')||'marketing';
function H(){return{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN}}
async function doAuth(){var m=$('#msg');m.textContent='…';var r=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(r.error){m.className='msg err';m.textContent=r.error.message;return}boot();}
async function boot(){
  var s=(await sb.auth.getSession()).data.session; if(!s)return;
  TOKEN=s.access_token;$('#gate').hidden=true;$('#app').hidden=false;$('#wallet').hidden=false;$('#tabs').hidden=false;
  APPS=await(await fetch('/api/apps')).json();
  $('#tabs').innerHTML='<a href="/">🎬 Creator</a>'+APPS.filter(a=>a.id!=='creator').map(a=>`<a href="/app?app=${a.id}" class="${a.id===appId?'on':''}">${a.emoji} ${a.name}</a>`).join('');
  CUR=APPS.find(a=>a.id===appId)||APPS[0];
  $('#app-kicker').textContent=CUR.name;$('#app-name').textContent=CUR.name;
  $('#fields').innerHTML=CUR.fields.map(f=>`<div class="field"><label>${f.label}</label>${f.type==='textarea'?`<textarea id="f-${f.k}"></textarea>`:`<input id="f-${f.k}">`}</div>`).join('');
  me();
}
async function me(){try{var j=await(await fetch('/api/me',{headers:H()})).json();$('#wallet').textContent=(j.wallet||0).toLocaleString()+' cr';window._w=j.wallet}catch(e){}}
async function run(){
  var fields={};CUR.fields.forEach(f=>fields[f.k]=($('#f-'+f.k)||{}).value||'');
  var out=$('#out');out.classList.add('on');out.innerHTML='<div style="font-size:26px">⚙️</div><p><b>Submitting…</b></p><div class="pbar"><i id="pb"></i></div>';
  var pb=$('#pb'),pct=8;pb.style.width='8%';
  var body={template:CUR.id,prompt:fields.prompt||'',fields:fields};
  try{
    var r=await fetch('/api/generate',{method:'POST',headers:H(),body:JSON.stringify(body)});
    if(!r.ok){var e=await r.json();out.innerHTML='<p style="color:var(--crit)">'+(e.detail||'error')+'</p>';return}
    var j=await r.json();me();
    var poll=setInterval(async function(){pct=Math.min(pct+6,92);pb.style.width=pct+'%';
      var s=await(await fetch('/api/job/'+j.job_id,{headers:H()})).json();
      if(s.status==='done'){clearInterval(poll);pb.style.width='100%';
        var media=s.kind==='image'?'<img class="res" src="'+s.file+'">':'<video class="res" src="'+s.file+'" controls autoplay muted loop></video>';
        var qc=s.qc?('<div class="qc '+s.qc+'">QC '+s.qc+' · '+(s.qc_note||'')+(s.transcript?' · “'+s.transcript.slice(0,60)+'”':'')+'</div>'):'';
        out.innerHTML='<p><b>Done</b> — '+s.credits+' cr</p>'+media+qc;me();}
      else if(s.status==='failed'){clearInterval(poll);out.innerHTML='<p style="color:var(--crit)"><b>Failed:</b> '+(s.err||'')+'</p><p class=note>Credits refunded.</p>';me();}
    },4000);
  }catch(e){out.innerHTML='<p style="color:var(--crit)">'+e+'</p>'}
}
boot();
</script></body></html>
