<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>369 Studio — App</title>
<link rel="stylesheet" href="/static/369.css">
<style>
.apptabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 14px;overflow-x:auto}
.apptabs a{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.apptabs a.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.wrap{max-width:720px;margin:0 auto}
.field{margin-bottom:12px}.field label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:6px}
.gen{display:inline-flex;flex-direction:column;align-items:center;padding:12px 24px;border-radius:12px;background:var(--lime);color:var(--lime-ink);font-weight:800;margin-top:6px}
.gen small{font-family:var(--mono);font-size:10.5px;opacity:.8}
.out{margin-top:20px;border:1px dashed var(--line2);border-radius:16px;padding:24px;text-align:center;color:var(--faint);background:var(--panel)}
.out.on{border-style:solid;border-color:var(--lime-dim);color:var(--text)}
.out video,.out img{max-width:100%;border-radius:12px;margin-top:8px}
.pbar{height:6px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:14px auto 0;max-width:320px}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--pink));transition:width .4s}
.qc{font-family:var(--mono);font-size:11px;margin-top:8px}.qc.pass{color:var(--cyan)}.qc.warn{color:var(--lime)}
</style></head>
<body>
<div id="shell"></div><div class="glow"></div>
<div class="frame"><div class="z"><div class="page"><div class="wrap">
  <div class="apptabs" id="tabs"></div>
  <div class="eyebrow" id="kick">App</div>
  <h1 id="nm" style="font-size:26px;margin-top:8px">…</h1>
  <p class="sub" id="sb" style="margin:8px 0 18px">Fill in and generate — same engine, app-shaped prompt.</p>
  <div id="fields"></div>
  <button class="gen" id="gen" onclick="run()">Generate <small id="cost">—</small></button>
  <div class="out" id="out"><div style="font-size:28px">✨</div><p>Result yahan aayega.</p></div>
  <p class="sub" style="font-size:11px;margin-top:12px">Same backend as Creator — this app shapes the prompt + params (template). QC gate on every render.</p>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script><script src="/static/shell.js"></script>
<script>
var $=s=>document.querySelector(s); var APPS=[],CUR=null; var appId=new URLSearchParams(location.search).get('app')||'marketing';
async function boot(){ if(!await Shell.mount('apps',{seg:'Apps'})) return;
  APPS=await (await fetch('/api/apps')).json();
  $('#tabs').innerHTML='<a href="/creator">🎬 Creator</a>'+APPS.filter(a=>a.id!=='creator').map(a=>'<a href="/app?app='+a.id+'" class="'+(a.id===appId?'on':'')+'">'+a.emoji+' '+a.name+'</a>').join('');
  CUR=APPS.find(a=>a.id===appId)||APPS[0]; $('#kick').textContent=CUR.name; $('#nm').textContent=CUR.name;
  $('#fields').innerHTML=CUR.fields.map(f=>'<div class="field"><label>'+f.label+'</label>'+(f.type==='textarea'?'<textarea id="f-'+f.k+'"></textarea>':'<input id="f-'+f.k+'">')+'</div>').join('');
}
async function run(){
  var fields={}; CUR.fields.forEach(f=>fields[f.k]=($('#f-'+f.k)||{}).value||'');
  var out=$('#out'); out.classList.add('on'); out.innerHTML='<div style="font-size:26px">⚙️</div><p><b>Submitting…</b></p><div class="pbar"><i id="pb"></i></div>';
  var pb=()=>$('#pb'),pct=8; pb().style.width='8%';
  try{
    var j=await Shell.api('/api/generate',{method:'POST',body:JSON.stringify({template:CUR.id,prompt:fields.prompt||'',fields:fields})});
    refreshWallet();
    var poll=setInterval(async function(){ pct=Math.min(pct+6,92); if(pb())pb().style.width=pct+'%';
      var s=await Shell.api('/api/job/'+j.job_id);
      if(s.status==='done'){ clearInterval(poll); if(pb())pb().style.width='100%';
        var media=s.kind==='image'?'<img src="'+s.file+'">':(s.kind==='music'?'<audio controls src="'+s.file+'" style="width:100%"></audio>':(s.kind==='text'||s.kind==='notes')?'':'<video src="'+s.file+'" controls autoplay muted loop></video>');
        var textout=''; if(s.kind==='text'||s.kind==='notes'){try{var t=await(await fetch(s.file)).text();textout='<div style="text-align:left;white-space:pre-wrap;max-height:40vh;overflow:auto">'+t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>';}catch(e){}}
        var qc=s.qc?('<div class="qc '+s.qc+'">QC '+s.qc+' · '+(s.qc_note||'')+'</div>'):'';
        out.innerHTML='<p><b>Done</b> — '+s.credits+' cr</p>'+media+textout+qc; refreshWallet();
      } else if(s.status==='failed'){ clearInterval(poll); out.innerHTML='<p style="color:var(--crit)"><b>Failed:</b> '+(s.err||'')+'</p><p class="sub">Credits refunded.</p>'; refreshWallet(); }
    },4000);
  }catch(e){ out.innerHTML='<p style="color:var(--crit)">'+e.message+'</p>'; }
}
function refreshWallet(){ Shell.api('/api/me').then(m=>{var w=document.getElementById('wallet');if(w)w.textContent=(m.wallet||0).toLocaleString()+' cr';}); }
boot();
</script></body></html>
