<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>369 Studio — AI Employees</title>
<link rel="stylesheet" href="/static/369.css">
<style>
.emp{aspect-ratio:3/4;border-radius:16px;position:relative;overflow:hidden;border:1px solid var(--line);display:flex;align-items:flex-end;cursor:pointer}
.emp .bg{position:absolute;inset:0} .emp .meta{position:relative;z-index:1;padding:14px;width:100%;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
.emp .nm{font-weight:800} .emp .role{color:var(--lime);font-size:11.5px;font-weight:700}
.emp .call{margin-top:8px;display:inline-flex;gap:6px;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px}
/* chat panel */
.chatwrap{max-width:820px;margin:0 auto}
.ehead{display:flex;align-items:center;gap:14px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.ehead .av{width:52px;height:52px;border-radius:14px} .ehead .nm{font-weight:800;font-size:16px} .ehead .role{color:var(--lime);font-size:12px;font-weight:700}
.thread{margin:16px 0;min-height:40vh}
.bub{padding:12px 14px;border-radius:14px;margin:10px 0;max-width:82%;white-space:pre-wrap}
.bub.u{background:var(--raise);margin-left:auto} .bub.a{background:var(--panel);border:1px solid var(--line)}
.composer{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0;background:linear-gradient(0deg,var(--bg) 70%,transparent)}
.free{font-size:11.5px;color:var(--faint);text-align:center;margin-top:4px}
</style></head>
<body>
<div id="shell"></div><div class="glow"></div>
<div class="frame"><div class="z"><div class="page">
  <div id="list">
    <div class="eyebrow">369 Studio</div><h1 style="font-size:28px;margin-top:8px">AI Employees</h1>
    <p class="sub" style="margin-top:6px">Chat face to face. They do the work and remember the context of your studio. <span style="color:var(--faint)">First replies free · then metered like any render.</span></p>
    <div class="grid g4" id="emps" style="margin-top:20px"></div>
  </div>
  <div class="chatwrap hidden" id="chat">
    <a href="/employees" class="sub" style="font-size:12.5px">← All employees</a>
    <div class="ehead" style="margin-top:10px"><div class="av" id="c-av"></div><div><div class="nm" id="c-nm"></div><div class="role" id="c-role"></div></div></div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <textarea id="q" rows="1" placeholder="Message…"></textarea>
      <button class="btn lime" onclick="send()">Send</button>
    </div>
    <div class="free">Powered by the 369 Studio engine · replies are metered from your credit wallet.</div>
  </div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script><script src="/static/shell.js"></script><script src="/static/employees.data.js"></script>
<script>
var $=s=>document.querySelector(s); var CUR=null;
async function boot(){ if(!await Shell.mount('employees',{seg:'AI Employees'})) return;
  var id=new URLSearchParams(location.search).get('e');
  if(id){ open_(id); } else { list(); }
}
function list(){ $('#list').classList.remove('hidden'); $('#chat').classList.add('hidden');
  $('#emps').innerHTML=EMPLOYEES.map(e=>'<div class="emp" onclick="location.href=\'/employees?e='+e.id+'\'">'
    +'<div class="bg" style="background:'+e.grad+'"></div><div class="meta"><div class="nm">'+e.name+'</div>'
    +'<div class="role">'+e.role+'</div><span class="call">🎥 Chat '+e.first+'</span></div></div>').join(''); }
function open_(id){ CUR=EMPLOYEES.find(e=>e.id===id)||EMPLOYEES[0];
  $('#list').classList.add('hidden'); $('#chat').classList.remove('hidden');
  $('#c-av').style.background=CUR.grad; $('#c-nm').textContent=CUR.name; $('#c-role').textContent=CUR.role;
  $('#thread').innerHTML='<div class="bub a">Hi, I\'m '+CUR.first+' — your '+CUR.role.toLowerCase()+' at 369 Studio. What are we working on?</div>'; }
var q=()=>$('#q'); document.addEventListener('input',e=>{if(e.target.id==='q'){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}});
async function send(){ var v=q().value.trim(); if(!v||!CUR)return; q().value=''; q().style.height='auto';
  var th=$('#thread'); th.insertAdjacentHTML('beforeend','<div class="bub u">'+esc(v)+'</div>');
  var id='a'+Date.now(); th.insertAdjacentHTML('beforeend','<div class="bub a" id="'+id+'">…</div>'); window.scrollTo(0,9e9);
  try{ var r=await Shell.api('/api/agent',{method:'POST',body:JSON.stringify({message:v,persona:CUR.persona})});
    document.getElementById(id).textContent=r.reply||''; }
  catch(e){ document.getElementById(id).innerHTML='<span style="color:var(--crit)">'+e.message+'</span>'; } window.scrollTo(0,9e9); }
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
boot();
</script></body></html>
