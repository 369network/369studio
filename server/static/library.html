<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>369 Studio — Characters</title>
<link rel="stylesheet" href="/static/369.css">
<style>
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tabbar button{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line2)}
.tabbar button.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.cchar{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.cchar .im{aspect-ratio:3/4;width:100%;object-fit:cover;background:#14151b}
.cchar .meta{padding:10px 11px}
.cchar .nm{font-weight:700;font-size:13px}.cchar .cat{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.cchar .row{display:flex;gap:6px;margin-top:9px}
.cchar .b{flex:1;text-align:center;padding:7px;border-radius:9px;font-weight:800;font-size:11.5px}
.cchar .use{background:var(--lime);color:var(--lime-ink)}
.cchar .use.done{background:var(--cyan)}
.cchar .play{background:var(--panel2);border:1px solid var(--line2);flex:0 0 40px}
.cchar .clone{background:var(--panel2);border:1px solid var(--line2);flex:0 0 40px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--lime);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:.3s}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;z-index:60;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .card{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px;max-width:440px;width:100%}
</style></head>
<body>
<div id="shell"></div><div class="glow"></div>
<div class="frame"><div class="z"><div class="page">
  <div class="eyebrow">AI Influencer · Character Library</div>
  <h1 style="font-size:26px;margin-top:8px">Pick a character. It's free.</h1>
  <p class="sub" style="margin-top:6px;font-size:13px">75 ready-made identities with matching voices. <b style="color:var(--lime)">Free to use</b> — credits only when you render. "Use" adds it to your Identity picker in Creator & Marketing.</p>
  <div class="tabbar" id="tabs"></div>
  <div class="grid g6" id="grid"></div>
</div></div></div>
<audio id="au"></audio>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card">
  <div class="eyebrow">Voice clone</div><h3 style="font-size:18px;margin-top:6px" id="m-nm"></h3>
  <p class="sub" style="font-size:12.5px;margin-top:6px">Type a line and hear it in this character's voice.</p>
  <textarea id="m-text" rows="3" style="margin-top:10px" placeholder="Type what they should say…"></textarea>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn lime" style="flex:1" onclick="doClone()">Generate voice</button><button class="btn ghost" onclick="closeModal()">Close</button></div>
  <div class="msg" id="m-msg"></div><audio id="m-au" controls style="width:100%;margin-top:10px;display:none"></audio>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script><script src="/static/shell.js"></script>
<script>
var $=s=>document.querySelector(s); var LIB=[],FILT='all',USED={};
async function boot(){ if(!await Shell.mount('apps',{seg:'AI Influencer'})) return;
  LIB=await (await fetch('/static/library/library.json')).json();
  try{var mine=await Shell.api('/api/characters'); (mine||[]).forEach(c=>{if(c.meta&&c.meta.lib)USED[c.meta.lib]=1;});}catch(e){}
  $('#tabs').innerHTML=[['all','All'],['human','Human'],['animal','Animal'],['fantasy','Fantasy']].map(t=>'<button class="'+(t[0]===FILT?'on':'')+'" onclick="setF(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  render();
}
function setF(f){FILT=f;document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('on'));event.target.classList.add('on');render();}
function render(){ var list=LIB.filter(c=>FILT==='all'||c.category===FILT);
  $('#grid').innerHTML=list.map(function(c){var used=USED[c.id];
    return '<div class="cchar"><img class="im" loading="lazy" src="/static/'+c.img+'">'
      +'<div class="meta"><div class="nm">'+c.name+'</div><div class="cat">'+c.category+'</div>'
      +'<div class="row">'
      +'<button class="b use'+(used?' done':'')+'" onclick="use(\''+c.id+'\',this)">'+(used?'✓ Added':'Use')+'</button>'
      +(c.voice?'<button class="b play" onclick="play(\''+c.id+'\')" title="Hear voice">▶</button>':'')
      +(c.voice?'<button class="b clone" onclick="openClone(\''+c.id+'\')" title="Voice clone">🎙</button>':'')
      +'</div></div></div>';}).join('');
}
function play(id){var c=LIB.find(x=>x.id===id);var a=$('#au');a.src='/static/'+c.voice;a.play();}
async function use(id,btn){var c=LIB.find(x=>x.id===id);
  try{ await Shell.api('/api/characters',{method:'POST',body:JSON.stringify({name:c.name,type:c.category,gender:'',
        meta:{ref:'server/static/'+c.img,img:'/static/'+c.img,voice:c.voice?('/static/'+c.voice):null,lib:c.id}})});
    USED[id]=1; btn.classList.add('done'); btn.textContent='✓ Added'; toast(c.name+' added to your Identity library'); }
  catch(e){ toast('Error: '+e.message); }
}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200);}
var CLONE=null;
function openClone(id){CLONE=LIB.find(x=>x.id===id);$('#m-nm').textContent=CLONE.name;$('#m-msg').textContent='';$('#m-au').style.display='none';$('#modal').classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');}
async function doClone(){var t=$('#m-text').value.trim();if(!t||!CLONE)return;var m=$('#m-msg');m.className='msg';m.textContent='Generating…';
  try{ var r=await Shell.api('/api/voice',{method:'POST',body:JSON.stringify({text:t,voice_id:CLONE.id})});
    if(r.file){var a=$('#m-au');a.src=r.file;a.style.display='block';a.play();m.textContent='';}
    else{m.className='msg';m.textContent=r.note||'Voice lane not enabled yet.';}
  }catch(e){m.className='msg err';m.textContent=e.message;}
}
boot();
</script></body></html>
