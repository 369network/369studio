<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>369 Studio — Creator</title>
<link rel="stylesheet" href="/static/369.css">
<style>
.stage{max-width:900px;margin:0 auto;text-align:center;padding-top:6vh;min-height:44vh}
.stage .wb{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.stage h1{font-size:clamp(26px,4vw,40px);margin-top:10px}
.stage .sub{margin-top:8px}
.result{max-width:640px;margin:14px auto 0}
.result video,.result img{border-radius:14px;width:100%}
.qc{font-family:var(--mono);font-size:11px;margin-top:8px}.qc.pass{color:var(--cyan)}.qc.warn{color:var(--lime)}
.pbar{height:6px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:14px auto 0;max-width:360px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--pink));transition:width .4s}
.dock{position:fixed;left:64px;right:0;bottom:0;z-index:20;padding:0 clamp(12px,3vw,26px) 18px;
  background:linear-gradient(0deg,var(--bg) 62%,transparent)}
.dock-in{max-width:900px;margin:0 auto}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.chipbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;font-weight:700}
.menu{position:absolute;bottom:44px;left:0;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:8px;min-width:210px;max-height:280px;overflow:auto;box-shadow:0 20px 50px -20px #000;z-index:5}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--muted)}
.menu button:hover,.menu button.on{background:var(--raise);color:var(--text)}
.promptbox{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.promptbox textarea{background:transparent;border:0;min-height:26px;padding:2px}
.gen{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;border-radius:12px;background:var(--lime);color:var(--lime-ink);font-weight:800;min-width:120px}
.gen small{font-family:var(--mono);font-size:10.5px;opacity:.8;font-weight:700}
.gen:disabled{opacity:.55}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sel{position:relative}
.selbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;font-weight:700}
.sel.mode .selbtn{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}
.idpick{max-width:900px;margin:0 auto 8px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.idpick .c{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;cursor:pointer}
.idpick .c.on{border-color:var(--lime);color:var(--lime)}
</style></head>
<body>
<div id="shell"></div><div class="glow"></div>
<div class="frame"><div class="z">
  <div class="stage" id="stage">
    <div class="wb" id="wb">Welcome</div>
    <h1>Start creating</h1>
    <p class="sub">Describe a scene, character, mood, or style — and watch it come to life.</p>
    <div class="result hidden" id="result"></div>
  </div>
</div></div>

<div class="dock"><div class="dock-in">
  <div class="idpick" id="idpick" style="display:none"></div>
  <div class="chips" id="chips"></div>
  <div class="promptbox">
    <span style="color:var(--faint);font-size:18px">＋</span>
    <textarea id="prompt" rows="1" placeholder="Describe the shot you want to film"></textarea>
    <button class="gen" id="gen" onclick="run()">Generate<small id="cost">— cr</small></button>
  </div>
  <div class="ctrl" id="ctrl"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script><script src="/static/shell.js"></script>
<script>
var $=s=>document.querySelector(s);
var MODES=[{k:"video",l:"Video"},{k:"image",l:"Image"},{k:"r2v",l:"Reference → Video"},{k:"music",l:"Music"},{k:"text",l:"Text Chat"}];
var MODELS=[["frontier","369 Frontier"],["crun_fast","369 Economy"],["seedance25","Seedance 2.5"],["veo31","Veo 3.1"],["veo31_fast","Veo 3.1 Fast"],["kling_o3_pro","Kling O3 Pro"],["pixverse","PixVerse"]];
var ASPECT=["16:9","9:16","1:1","4:5"], RES=["480p","720p","1080p"], DUR=["4s","8s","15s"];
var OPT={camera:["Auto","ARRI Alexa 35","ARRI Alexa Mini LF","RED Komodo 6K","RED Monstro 8K VV","Blackmagic URSA 12K","Blackmagic Pocket 6K","iPhone cinematic","Vintage Super 8"],
  settings:["Auto","Wide 24mm","Portrait 85mm","Macro","Drone / FPV","Handheld","Tripod locked"],
  look:["Auto","Teal & orange","Bleach bypass","Golden hour","Neon noir","Kodak Portra","High-key clean","Moody low-key"],
  genre:["Auto","Action","Horror","Romance","Sci-Fi","Fantasy","Noir","Documentary","Claymation","Anime","Cyberpunk"]};
var st={mode:"video",model:"crun_fast",ar:"16:9",res:"480p",dur:"4s",audio:true,camera:"Auto",settings:"Auto",look:"Auto",genre:"Auto",ref:null};
var CHARS=[];

async function boot(){ if(!await Shell.mount('studio',{seg:'Studio'})) return;
  $('#wb').textContent='Welcome back, '+((Shell.me&&Shell.me.name)||'creator').split('@')[0];
  renderCtrl(); loadChars();
  document.addEventListener('click',e=>{ if(!e.target.closest('.sel')) document.querySelectorAll('.sel .menu').forEach(m=>m.remove()); });
}
document.addEventListener('input',e=>{if(e.target.id==='prompt'){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}});
var pr=()=>$('#prompt');

function renderChips(){ if(st.mode!=='video'&&st.mode!=='r2v'){$('#chips').innerHTML='';return;}
  var mk=(name,key)=>'<div class="sel"><button class="chipbtn" onclick="openMenu(this,\''+key+'\')">'+name+' · <span style="color:var(--lime)">'+st[key]+'</span> ▾</button></div>';
  $('#chips').innerHTML=mk('🎥 Camera','camera')+mk('🎛 Settings','settings')+mk('🎨 Look','look')+mk('🎬 Genre','genre'); }
function openMenu(btn,key){ document.querySelectorAll('.sel .menu').forEach(m=>m.remove()); var box=btn.closest('.sel');
  box.insertAdjacentHTML('beforeend','<div class="menu">'+OPT[key].map(o=>'<button class="'+(st[key]===o?'on':'')+'" onclick="pick(\''+key+'\',this.textContent)">'+o+'</button>').join('')+'</div>'); }
function pick(key,val){ st[key]=val; document.querySelectorAll('.sel .menu').forEach(m=>m.remove()); renderChips(); }

function renderCtrl(){
  var modeL=MODES.find(m=>m.k===st.mode).l, html='';
  html+=csel('mode','● '+modeL, MODES.map(m=>[m.k,m.l]));
  if(st.mode==='video'||st.mode==='r2v'){
    var mm=(MODELS.find(x=>x[0]===st.model)||[])[1]||st.model;
    html+=csel('model','◆ '+mm, MODELS)+csel('ar','▭ '+st.ar, ASPECT.map(a=>[a,a]))+csel('res',st.res, RES.map(a=>[a,a]))+csel('dur','⏱ '+st.dur, DUR.map(a=>[a,a]));
    html+='<button class="selbtn" onclick="st.audio=!st.audio;renderCtrl()">🔊 Audio '+(st.audio?'On':'Off')+'</button>';
  } else if(st.mode==='image'){ html+=csel('ar','▭ '+st.ar, ASPECT.map(a=>[a,a])); }
  $('#ctrl').innerHTML=html;
  $('#idpick').style.display=(st.mode==='r2v')?'flex':'none';
  renderChips(); refreshCost();
}
function csel(key,label,opts){ return '<div class="sel '+key+'"><button class="selbtn" onclick=\'openCtrl(this,"'+key+'",'+JSON.stringify(opts)+')\'>'+label+' ▾</button></div>'; }
function openCtrl(btn,key,opts){ document.querySelectorAll('.sel .menu').forEach(m=>m.remove()); var box=btn.parentElement;
  box.insertAdjacentHTML('beforeend','<div class="menu">'+opts.map(o=>'<button class="'+(st[key]===o[0]?'on':'')+'" onclick="setSt(\''+key+'\',\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</div>'); }
function setSt(key,val){ st[key]=val; document.querySelectorAll('.sel .menu').forEach(m=>m.remove());
  if(key==='mode'){ pr().placeholder=(val==='music')?'Describe the song / vibe':(val==='text')?'Ask 369 Studio anything':(val==='image')?'Describe the image':'Describe the shot you want to film'; }
  renderCtrl(); }

async function loadChars(){ try{ CHARS=await Shell.api('/api/characters'); }catch(e){CHARS=[];}
  $('#idpick').innerHTML='<span class="sub" style="font-size:12px">Identity:</span>'
    +'<span class="c '+(st.ref?'':'on')+'" onclick="setRef(null)">None</span>'
    +CHARS.map(c=>{var r=(c.meta&&c.meta.ref||'').replace(/\\/g,"/");var img=c.meta&&c.meta.img; return '<span class="c '+(st.ref===r?'on':'')+'" onclick="setRef(\''+r+'\')">'+(img?'<img src="'+img+'" style="width:22px;height:22px;border-radius:50%;object-fit:cover">':'')+(c.name||'Char')+'</span>';}).join('')
    +'<a class="c" href="/library" style="border-style:dashed">+ Library</a>'; }
function setRef(r){ st.ref=r||null; loadChars(); }

async function refreshCost(){ try{ var m=(st.mode==='r2v')?'video':st.mode;
  var c=await Shell.api('/api/cost',{method:'POST',body:JSON.stringify({mode:m,model:st.model,res:st.res,dur:st.dur})});
  $('#cost').textContent=(c.credits||0)+' cr'; }catch(e){} }

async function run(){
  var v=pr().value.trim(); if(!v){pr().focus();return;}
  var suf=[]; if(st.camera!=='Auto')suf.push('shot on '+st.camera); if(st.settings!=='Auto')suf.push(st.settings);
  if(st.look!=='Auto')suf.push(st.look+' grade'); if(st.genre!=='Auto')suf.push(st.genre+' genre');
  var prompt=v+(suf.length?(' — '+suf.join(', ')):'');
  var mode=(st.mode==='r2v')?'video':st.mode;
  var body={prompt:prompt,mode:mode,model:st.model,res:st.res,dur:st.dur,ar:st.ar,audio:st.audio};
  if(st.mode==='r2v'&&st.ref)body.refs=[st.ref];
  var res=$('#result'); res.classList.remove('hidden'); res.innerHTML='<div class="pbar"><i id="pb"></i></div><p class="sub" style="margin-top:8px">Submitting…</p>';
  $('#gen').disabled=true; var pct=8; var pb=()=>$('#pb'); pb().style.width='8%';
  try{
    var j=await Shell.api('/api/generate',{method:'POST',body:JSON.stringify(body)});
    var poll=setInterval(async function(){ pct=Math.min(pct+6,92); if(pb())pb().style.width=pct+'%';
      var s=await Shell.api('/api/job/'+j.job_id);
      if(s.status==='done'){ clearInterval(poll); $('#gen').disabled=false;
        var media=s.kind==='image'?'<img src="'+s.file+'">':(s.kind==='music'?'<audio controls src="'+s.file+'" style="width:100%"></audio>':(s.kind==='text'||s.kind==='notes')?'':'<video src="'+s.file+'" controls autoplay muted loop></video>');
        var textout=''; if(s.kind==='text'||s.kind==='notes'){ try{var t=await (await fetch(s.file)).text(); textout='<div style="text-align:left;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:40vh;overflow:auto">'+esc(t)+'</div>';}catch(e){} }
        var qc=s.qc?('<div class="qc '+s.qc+'">QC '+s.qc+' · '+(s.qc_note||'')+'</div>'):'';
        res.innerHTML='<p class="sub"><b style="color:var(--text)">Done</b> — '+s.credits+' cr</p>'+media+textout+qc; refreshWallet();
      } else if(s.status==='failed'){ clearInterval(poll); $('#gen').disabled=false;
        res.innerHTML='<p style="color:var(--crit)"><b>Failed:</b> '+(s.err||'')+'</p><p class="sub">Credits refunded.</p>'; refreshWallet(); }
    },4000);
  }catch(e){ $('#gen').disabled=false; res.innerHTML='<p style="color:var(--crit)">'+e.message+'</p>'; }
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function refreshWallet(){ Shell.api('/api/me').then(m=>{var w=document.getElementById('wallet');if(w)w.textContent=(m.wallet||0).toLocaleString()+' cr';}); }
boot();
</script></body></html>
